name: FBSU Moodle Watcher

on:
  schedule:
    # كل 5 دقايق (GitHub Actions يحسب الوقت بتوقيت UTC)
    # ملاحظة: هذا التكرار يتجاوز الحد المجاني لمستودع Private، لذا لازم
    # يكون هذا المستودع Public حتى يضل مجاني بدون أي حدود.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # يسمح بتشغيل يدوي من تبويب Actions للتجربة

permissions:
  contents: write   # مطلوب حتى يقدر الووركفلو يحفظ (يكومت) ملف state.json

concurrency:
  group: fbsu-moodle-watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          MOODLE_URL: ${{ secrets.MOODLE_URL }}
          MOODLE_USERNAME: ${{ secrets.MOODLE_USERNAME }}
          MOODLE_PASSWORD: ${{ secrets.MOODLE_PASSWORD }}
          POKE_API_KEY: ${{ secrets.POKE_API_KEY }}
        run: python moodle_watcher.py

      - name: Save state (commit state.json if changed)
        run: |
          git config user.name "fbsu-moodle-watcher-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "تحديث الحالة [skip ci]"
          git pull --rebase origin main
          git push
